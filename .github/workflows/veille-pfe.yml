name: Veille PFE

# Runs the passes of a private watch: the code, the configuration, the CV content and the memory live in the
# private repository IlyasBBB/veille-pfe, checked out with the secret DATA_REPO_TOKEN. Minutes are free and
# unlimited here because this repository is public; nothing personal is printed in these logs: everything the
# watch writes goes to a log file saved in the private repository (logs/).
on:
  schedule:
    # backup of the external trigger (cron-job.org, every 3 hours); "auto" skips a pass that ran recently
    - cron: "23 5,17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run | auto (skips if a pass ran recently) | test-email | check-sources | check-cv | check-ia | dry-run | status | renvoi | essai-contacts | feuille"
        type: choice
        options: [run, auto, test-email, check-sources, check-cv, check-ia, dry-run, status, renvoi, essai-contacts, feuille]
        default: run
      campagne:
        description: "toutes | maroc | france | hongkong"
        type: choice
        options: [toutes, maroc, france, hongkong]
        default: toutes

permissions:
  contents: write   # only for the monthly keep-alive commit of this repository (the memory goes to the private one)

concurrency:
  group: veille-pfe
  cancel-in-progress: false

env:
  MODE: ${{ github.event_name == 'schedule' && 'auto' || inputs.mode || 'run' }}
  CAMPAGNE: ${{ inputs.campagne || 'toutes' }}

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Get the private watch
        uses: actions/checkout@v7
        with:
          repository: IlyasBBB/veille-pfe
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-indeed.txt

      - name: Install
        run: |
          echo "PFE_JOB_DEADLINE=$(( $(date +%s) + 110 * 60 ))" >> "$GITHUB_ENV"
          mkdir -p logs
          echo "LOG=logs/$(date -u +%Y-%m-%d_%H%M)_${MODE}_${CAMPAGNE}.log" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet
          pip install --upgrade -r requirements-indeed.txt --quiet || echo "::warning::python-jobspy not installed: Indeed and HelloWork skipped this time"
          case "$CAMPAGNE" in
            maroc) echo "CONFIGS=config.yaml" >> "$GITHUB_ENV" ;;
            france) echo "CONFIGS=config_france.yaml" >> "$GITHUB_ENV" ;;
            hongkong) echo "CONFIGS=config_hongkong.yaml" >> "$GITHUB_ENV" ;;
            *) echo "CONFIGS=config.yaml config_france.yaml config_hongkong.yaml" >> "$GITHUB_ENV" ;;
          esac

      - name: Look for offers
        if: env.MODE == 'run' || env.MODE == 'auto'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          status=0
          for cfg in $CONFIGS; do
            [ -f "$cfg" ] || continue
            echo "===== $cfg : collect =====" >> "$LOG"
            python run.py --config "$cfg" --mode "$MODE" --stage collect >> "$LOG" 2>&1 || status=1
          done
          echo "Done (details in the private repository, $LOG)."
          exit $status

      - name: Count the CVs to build
        id: todo
        if: ${{ !cancelled() }}
        run: |
          total=0
          for cfg in $CONFIGS; do
            [ -f "$cfg" ] || continue
            n=$(python run.py --config "$cfg" --mode "$MODE" --pending-count 2>> "$LOG" | tail -n 1)
            total=$((total + ${n:-0}))
          done
          echo "count=$total" >> "$GITHUB_OUTPUT"

      - name: Restore the LaTeX packages
        if: ${{ !cancelled() && steps.todo.outputs.count != '0' }}
        uses: actions/cache/restore@v6
        with:
          path: ~/texlive-debs
          key: texlive-${{ runner.os }}-24.04-v1-${{ github.run_id }}
          restore-keys: texlive-${{ runner.os }}-24.04-v1-

      - name: Install LaTeX
        id: latex
        if: ${{ !cancelled() && steps.todo.outputs.count != '0' }}
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          DEBS="$HOME/texlive-debs"
          mkdir -p "$DEBS/partial"
          PKGS="texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-pictures"
          if ls "$DEBS"/*.deb > /dev/null 2>&1 && timeout 300 sudo dpkg -i "$DEBS"/*.deb > /dev/null 2>&1 \
             && command -v pdflatex > /dev/null; then
            echo "LaTeX installed from the cache."
          else
            APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
            timeout 180 sudo apt-get $APT update -qq || echo "::warning::apt-get update was slow or failed"
            ok=0
            for attempt in 1 2 3; do
              if timeout 420 sudo apt-get $APT install -y -qq --no-install-recommends \
                   -o Dir::Cache::Archives="$DEBS" -o APT::Keep-Downloaded-Packages=true $PKGS > /dev/null; then
                ok=1; break
              fi
              echo "::warning::LaTeX install attempt $attempt failed"
              sudo dpkg --configure -a || true
            done
            if [ "$ok" != 1 ]; then echo "::error::LaTeX could not be installed"; exit 1; fi
            sudo rm -rf "$DEBS/partial" "$DEBS/lock"
            sudo chown -R "$USER" "$DEBS"
            echo "fresh=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the LaTeX packages for the next passes
        if: ${{ !cancelled() && steps.latex.outputs.fresh == '1' }}
        uses: actions/cache/save@v6
        with:
          path: ~/texlive-debs
          key: texlive-${{ runner.os }}-24.04-v1-${{ github.run_id }}

      - name: Send the emails
        if: ${{ !cancelled() }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SHEETS_URL: ${{ secrets.SHEETS_URL }}
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
        run: |
          status=0
          for cfg in $CONFIGS; do
            [ -f "$cfg" ] || continue
            if [ "$MODE" = "check-ia" ] && [ "$cfg" != "config.yaml" ] && [ "$CAMPAGNE" = "toutes" ]; then continue; fi
            echo "===== $cfg : $MODE =====" >> "$LOG"
            if [ "$MODE" = "run" ] || [ "$MODE" = "auto" ]; then
              python run.py --config "$cfg" --mode "$MODE" --stage notify >> "$LOG" 2>&1 || status=1
            else
              python run.py --config "$cfg" --mode "$MODE" >> "$LOG" 2>&1 || status=1
            fi
          done
          echo "Done (details in the private repository, $LOG)."
          exit $status

      - name: Save the memory and the log in the private repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls -1 logs/*.log 2>/dev/null | sort -r | tail -n +61 | xargs -r rm -f   # the 60 latest logs (by name)
          git add -A -f logs
          case "$MODE" in
            run|auto|renvoi|essai-contacts|feuille) git add -A data data_france data_hongkong ;;
            check-cv) if [ -d cv_apercu ]; then git add -A -f cv_apercu; fi ;;
          esac
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit --quiet -m "Veille PFE: mémoire mise à jour [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --quiet && git push --quiet; then echo "Saved."; exit 0; fi
            sleep 5
          done
          echo "::error::Could not save the memory in the private repository"
          exit 1

  keepalive:
    # GitHub turns off the scheduled workflows of a public repository after 60 days without a commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Commit once a month
        run: |
          last=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          if [ $(( $(date +%s) - last )) -lt $(( 30 * 86400 )) ]; then echo "Recent commit: nothing to do."; exit 0; fi
          date -u +%Y-%m-%d > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive && git commit --quiet -m "keep-alive" && git push --quiet && echo "Keep-alive commit pushed."
